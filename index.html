<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingoVerse 语界 · 多语种沉浸式学习平台（离线版）</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  <style>
/* ============================================================
   LingoVerse 语界 · 设计系统
   ============================================================ */
:root {
  --bg: #F5F6FB;
  --card: #FFFFFF;
  --ink: #1E2235;
  --muted: #6E7391;
  --line: #E8EAF3;
  --primary: #6C5CE7;
  --primary-deep: #5546D6;
  --primary-soft: #EEEBFF;
  --grad: linear-gradient(135deg, #6C5CE7 0%, #A78BFA 100%);
  --grad-warm: linear-gradient(135deg, #FF9A62 0%, #FF5D8F 100%);
  --en: #4F8CFF;
  --ja: #FF5D8F;
  --ko: #12B886;
  --green: #23B37D;
  --orange: #FF9F43;
  --red: #F0574F;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 6px 24px rgba(80, 84, 145, 0.09);
  --shadow-lg: 0 16px 48px rgba(80, 84, 145, 0.16);
  font-size: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; font-size: 1rem; color: var(--ink); }
img { max-width: 100%; }

/* ---------- 启动屏 ---------- */
.boot-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.boot-logo { font-size: 64px; animation: bob 1.2s ease-in-out infinite; }
.boot-text { color: var(--muted); letter-spacing: 2px; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ---------- 顶部导航 ---------- */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,0.86); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1120px; margin: 0 auto; padding: 0 20px; height: 62px;
  display: flex; align-items: center; gap: 22px;
}
.nav-logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 1.12rem; }
.nav-logo .globe { font-size: 1.45rem; }
.nav-logo em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav-links { display: flex; gap: 4px; flex: 1; }
.nav-link {
  padding: 8px 14px; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 0.95rem;
  transition: all .18s;
}
.nav-link:hover { color: var(--primary); background: var(--primary-soft); }
.nav-link.active { color: var(--primary); background: var(--primary-soft); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-stat { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 0.92rem; color: var(--ink); background: #FFF6E8; padding: 6px 11px; border-radius: 99px; }
.nav-stat.xp { background: var(--primary-soft); color: var(--primary-deep); }
.nav-user { position: relative; }
.nav-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; cursor: pointer; border: 2px solid transparent; transition: border-color .18s; }
.nav-avatar:hover { border-color: var(--primary); }
.nav-menu {
  position: absolute; right: 0; top: 48px; width: 210px; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg);
  padding: 8px; display: none; flex-direction: column; gap: 2px; z-index: 60;
}
.nav-menu.open { display: flex; }
.nav-menu .mi { text-align: left; padding: 10px 12px; border-radius: 9px; font-size: 0.93rem; font-weight: 600; color: var(--ink); }
.nav-menu .mi:hover { background: var(--bg); color: var(--primary); }
.nav-menu .mi.danger { color: var(--red); }
.nav-menu .mhead { padding: 10px 12px 6px; font-size: 0.85rem; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.btn-login { padding: 9px 18px; border-radius: 11px; font-weight: 700; font-size: 0.92rem; color: var(--primary-deep); }
.btn-login:hover { background: var(--primary-soft); }
.btn-primary { background: var(--grad); color: #fff; padding: 9px 18px; border-radius: 11px; font-weight: 700; font-size: 0.92rem; box-shadow: 0 6px 16px rgba(108,92,231,0.35); transition: transform .15s, box-shadow .15s; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 9px 22px rgba(108,92,231,0.42); }

/* ---------- 布局 ---------- */
.page { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-title { font-size: 1.65rem; font-weight: 800; letter-spacing: 0.5px; }
.page-sub { color: var(--muted); margin-top: 5px; font-size: 0.95rem; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.grid { display: grid; gap: 18px; }

/* ---------- Toast / Modal ---------- */
#toast-box { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.toast {
  background: rgba(30,34,53,0.94); color: #fff; padding: 11px 20px; border-radius: 12px;
  font-size: 0.93rem; font-weight: 600; box-shadow: var(--shadow-lg);
  animation: toastIn .25s ease, toastOut .3s ease 2.4s forwards;
  display: flex; align-items: center; gap: 8px; max-width: 86vw;
}
.toast.success { background: rgba(35,179,125,0.96); }
.toast.error { background: rgba(240,87,79,0.96); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }
.modal-mask { position: fixed; inset: 0; background: rgba(25,28,45,0.5); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn .2s; }
.modal { background: var(--card); border-radius: 20px; width: 100%; max-width: 520px; padding: 26px; box-shadow: var(--shadow-lg); animation: popIn .22s cubic-bezier(.2,1.4,.4,1); max-height: 88vh; overflow-y: auto; }
.modal h3 { font-size: 1.2rem; margin-bottom: 16px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(10px); } }

/* ---------- 表单 ---------- */
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 7px; color: var(--ink); }
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  background: #FAFBFF; outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,92,231,0.14); background: #fff; }
.field textarea { resize: vertical; min-height: 110px; }
.form-error { color: var(--red); font-size: 0.87rem; margin-top: 4px; min-height: 1.2em; }
.btn-block { width: 100%; padding: 13px; font-size: 1rem; border-radius: 13px; }
.btn-ghost { border: 1.5px solid var(--line); background: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; color: var(--ink); transition: all .15s; }
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

/* ---------- 落地页 ---------- */
.hero { position: relative; overflow: hidden; padding: 78px 20px 64px; text-align: center; }
.hero-blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; pointer-events: none; }
.hero-blob.b1 { width: 420px; height: 420px; background: #C7BFFF; top: -160px; left: -120px; }
.hero-blob.b2 { width: 380px; height: 380px; background: #FFD3E4; top: -60px; right: -120px; }
.hero-blob.b3 { width: 300px; height: 300px; background: #B8F2E6; bottom: -160px; left: 40%; }
.hero-inner { position: relative; max-width: 780px; margin: 0 auto; }
.hero-tag { display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--line); padding: 7px 15px; border-radius: 99px; font-size: 0.85rem; font-weight: 700; color: var(--primary-deep); box-shadow: var(--shadow); margin-bottom: 22px; }
.hero h1 { font-size: 2.9rem; line-height: 1.22; font-weight: 900; letter-spacing: 1px; }
.hero h1 .hl { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lead { margin: 18px auto 30px; color: var(--muted); font-size: 1.1rem; line-height: 1.8; max-width: 560px; }
.hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.hero-cta .btn-primary { font-size: 1.02rem; padding: 14px 30px; border-radius: 14px; }
.hero-flags { margin-top: 34px; font-size: 1.9rem; letter-spacing: 14px; }
.feature-grid { max-width: 1020px; margin: 10px auto 0; padding: 0 20px 70px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
.feature { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); transition: transform .2s; }
.feature:hover { transform: translateY(-4px); }
.feature .ic { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 14px; background: var(--primary-soft); }
.feature h3 { font-size: 1.02rem; margin-bottom: 8px; }
.feature p { color: var(--muted); font-size: 0.88rem; line-height: 1.7; }
.lang-strip { max-width: 1020px; margin: 0 auto 80px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.lang-card { border-radius: var(--radius); padding: 26px; color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.lang-card .flag { font-size: 2.6rem; }
.lang-card h3 { font-size: 1.3rem; margin: 10px 0 4px; }
.lang-card .en { opacity: .85; font-size: 0.9rem; font-weight: 600; }
.lang-card p { margin-top: 12px; font-size: 0.9rem; line-height: 1.7; opacity: .92; }
.lang-card .courses { position: absolute; top: 22px; right: 22px; background: rgba(255,255,255,0.22); padding: 5px 12px; border-radius: 99px; font-size: 0.8rem; font-weight: 700; }

/* ---------- 仪表盘 ---------- */
.dash-welcome { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.dash-hi { font-size: 1.6rem; font-weight: 800; }
.dash-hi span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dash-date { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: flex; align-items: center; gap: 13px; }
.stat-card .ic { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
.stat-card .num { font-size: 1.3rem; font-weight: 800; line-height: 1.1; }
.stat-card .lbl { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }
.dash-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
.rec-list { display: flex; flex-direction: column; gap: 12px; }
.rec-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px;
  border: 1.5px solid var(--line); transition: all .18s; cursor: pointer; background: #fff;
}
.rec-item:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateX(3px); }
.rec-item .ric { width: 46px; height: 46px; border-radius: 13px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
.rec-item .rt { font-weight: 700; font-size: 0.97rem; }
.rec-item .rd { color: var(--muted); font-size: 0.84rem; margin-top: 3px; line-height: 1.5; }
.rec-item .rr { font-size: 0.78rem; color: var(--primary); font-weight: 700; margin-top: 5px; }
.rec-item .go { margin-left: auto; color: var(--muted); font-size: 1.1rem; }
.goal-ring-box { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0 4px; }
.ring-num { font-size: 1.75rem; font-weight: 800; }
.ring-lbl { color: var(--muted); font-size: 0.85rem; }
.week-chart { margin-top: 6px; }

/* ---------- 课程页 ---------- */
.lang-tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.lang-tab {
  display: flex; align-items: center; gap: 9px; padding: 10px 18px; border-radius: 13px;
  background: #fff; border: 1.5px solid var(--line); font-weight: 700; font-size: 0.95rem; transition: all .18s;
}
.lang-tab:hover { border-color: var(--primary); }
.lang-tab.active { color: #fff; border-color: transparent; box-shadow: var(--shadow); }
.level-block { margin-bottom: 30px; }
.level-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.level-badge { background: var(--grad); color: #fff; font-weight: 800; padding: 5px 13px; border-radius: 9px; font-size: 0.85rem; }
.level-name { font-weight: 800; font-size: 1.05rem; }
.level-desc { color: var(--muted); font-size: 0.86rem; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.course-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: transform .2s, box-shadow .2s; cursor: pointer; }
.course-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.course-card .cc-top { padding: 20px 20px 14px; display: flex; gap: 14px; align-items: flex-start; }
.course-card .cc-icon { width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
.course-card h3 { font-size: 1.03rem; line-height: 1.4; }
.course-card .cc-sub { color: var(--muted); font-size: 0.84rem; margin-top: 5px; line-height: 1.55; }
.course-card .cc-bottom { padding: 0 20px 18px; }
.cc-meta { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
.progress-bar { height: 7px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.progress-bar > div { height: 100%; border-radius: 99px; background: var(--grad); transition: width .5s ease; }
.progress-bar.done > div { background: linear-gradient(90deg, #23B37D, #4ADE9C); }

/* 课程详情 */
.course-hero { border-radius: 22px; padding: 30px; color: #fff; margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); }
.course-hero .flag { font-size: 2rem; }
.course-hero h2 { font-size: 1.7rem; margin-top: 8px; }
.course-hero p { opacity: .92; margin-top: 8px; line-height: 1.7; max-width: 620px; }
.course-hero .lvl { position: absolute; top: 26px; right: 26px; background: rgba(255,255,255,0.22); padding: 7px 15px; border-radius: 99px; font-weight: 800; font-size: 0.9rem; }
.lesson-list { display: flex; flex-direction: column; gap: 12px; }
.lesson-row {
  display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: 16px;
  padding: 16px 20px; box-shadow: var(--shadow); transition: all .18s; cursor: pointer; border: 1.5px solid transparent;
}
.lesson-row:hover { transform: translateX(4px); border-color: var(--primary); }
.lesson-row .l-ic { width: 50px; height: 50px; border-radius: 14px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 1.45rem; flex-shrink: 0; }
.lesson-row .l-t { font-weight: 700; font-size: 1rem; }
.lesson-row .l-s { color: var(--muted); font-size: 0.84rem; margin-top: 4px; }
.lesson-row .l-score { font-weight: 800; font-size: 0.9rem; padding: 5px 11px; border-radius: 99px; background: #E9FBF3; color: var(--green); }
.lesson-row .l-min { color: var(--muted); font-size: 0.82rem; }
.lesson-row.locked { opacity: .55; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 700; font-size: 0.9rem; margin-bottom: 16px; }
.back-link:hover { color: var(--primary); }

/* ---------- 课程播放器 ---------- */
.player-wrap { max-width: 780px; margin: 0 auto; }
.player-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.player-top .back { width: 40px; height: 40px; border-radius: 12px; background: #fff; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
.player-title { flex: 1; }
.player-title .pt1 { font-weight: 800; font-size: 1.1rem; }
.player-title .pt2 { color: var(--muted); font-size: 0.83rem; margin-top: 2px; }
.phase-bar { display: flex; gap: 8px; margin-bottom: 22px; }
.phase-chip { flex: 1; text-align: center; padding: 9px 4px; border-radius: 11px; font-size: 0.8rem; font-weight: 700; color: var(--muted); background: #fff; border: 1.5px solid var(--line); transition: all .25s; white-space: nowrap; overflow: hidden; }
.phase-chip.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(108,92,231,0.3); }
.phase-chip.done { color: var(--green); border-color: #BDEBD8; background: #F0FBF6; }
.phase-card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow-lg); padding: 30px; min-height: 380px; display: flex; flex-direction: column; }
.phase-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.phase-tag { font-size: 0.8rem; font-weight: 800; color: var(--primary); background: var(--primary-soft); padding: 5px 12px; border-radius: 99px; letter-spacing: 1px; }
.phase-count { color: var(--muted); font-size: 0.85rem; font-weight: 700; }
.phase-title { font-size: 1.3rem; font-weight: 800; margin: 10px 0 20px; }
.phase-body { flex: 1; }
.phase-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 12px; }
.phase-progress { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; flex: 1; }
.phase-progress > div { height: 100%; background: var(--grad); border-radius: 99px; transition: width .3s; }
.btn-next { background: var(--grad); color: #fff; font-weight: 800; padding: 12px 26px; border-radius: 13px; font-size: 0.97rem; box-shadow: 0 6px 16px rgba(108,92,231,0.35); transition: transform .15s; }
.btn-next:hover { transform: translateY(-1px); }
.btn-next:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* 单词卡 */
.flashcard { position: relative; height: 240px; cursor: pointer; perspective: 1200px; }
.flashcard .fc-inner { position: absolute; inset: 0; transition: transform .5s cubic-bezier(.4,.1,.2,1.2); transform-style: preserve-3d; }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; }
.fc-front { background: var(--grad); color: #fff; box-shadow: 0 14px 34px rgba(108,92,231,0.4); }
.fc-front .term { font-size: 2.1rem; font-weight: 800; letter-spacing: 1px; }
.fc-front .reading { opacity: .85; font-size: 1rem; }
.fc-back { background: #fff; border: 2px solid var(--primary-soft); transform: rotateY(180deg); box-shadow: var(--shadow); }
.fc-back .trans { font-size: 1.7rem; font-weight: 800; color: var(--primary-deep); }
.fc-back .example { color: var(--muted); font-size: 0.95rem; margin-top: 10px; line-height: 1.7; }
.fc-hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 14px; }
.fc-audio { margin-top: 8px; }
.speaker-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.25); color: #fff; font-size: 1.2rem; display: inline-flex; align-items: center; justify-content: center; }
.speaker-btn.dark { background: var(--primary-soft); color: var(--primary); }
.speaker-btn:hover { transform: scale(1.08); }

/* 练习题 */
.quiz-q { font-size: 1.15rem; font-weight: 700; line-height: 1.7; margin-bottom: 18px; }
.quiz-opts { display: flex; flex-direction: column; gap: 11px; }
.quiz-opt {
  text-align: left; padding: 14px 18px; border-radius: 14px; border: 2px solid var(--line);
  background: #FAFBFF; font-size: 1rem; font-weight: 600; transition: all .15s; display: flex; align-items: center; gap: 12px;
}
.quiz-opt .key { width: 28px; height: 28px; border-radius: 9px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 800; color: var(--muted); flex-shrink: 0; }
.quiz-opt:hover { border-color: var(--primary); background: #fff; }
.quiz-opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.quiz-opt.right { border-color: var(--green); background: #F0FBF6; }
.quiz-opt.right .key { background: var(--green); color: #fff; }
.quiz-opt.wrong { border-color: var(--red); background: #FEF1F0; }
.quiz-opt.wrong .key { background: var(--red); color: #fff; }
.quiz-tip { margin-top: 14px; padding: 12px 15px; border-radius: 12px; background: #FFF9EC; color: #8A6D1F; font-size: 0.88rem; line-height: 1.6; animation: fadeIn .25s; }

/* 听力 */
.listen-box { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 12px 0; }
.listen-sphere { width: 108px; height: 108px; border-radius: 50%; background: var(--grad); color: #fff; font-size: 2.4rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 34px rgba(108,92,231,0.4); transition: transform .15s; }
.listen-sphere:hover { transform: scale(1.05); }
.listen-sphere.playing { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(108,92,231,0.45); } 50% { box-shadow: 0 0 0 22px rgba(108,92,231,0); } }
.listen-hint { color: var(--muted); font-size: 0.9rem; }
.type-input { width: 100%; max-width: 460px; padding: 14px 18px; font-size: 1.15rem; text-align: center; border: 2px solid var(--line); border-radius: 14px; outline: none; }
.type-input:focus { border-color: var(--primary); }
.reveal-sent { text-align: center; font-size: 1.2rem; font-weight: 700; line-height: 1.7; animation: fadeIn .3s; }
.reveal-zh { text-align: center; color: var(--muted); font-size: 0.92rem; margin-top: 8px; }

/* 口语 */
.speak-target { background: linear-gradient(135deg, #FFF0F5, #EFEAFF); border-radius: 18px; padding: 24px; text-align: center; margin-bottom: 20px; }
.speak-target .st-main { font-size: 1.55rem; font-weight: 800; line-height: 1.6; }
.speak-target .st-zh { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }
.speak-target .st-hint { margin-top: 10px; font-size: 0.85rem; color: var(--primary-deep); background: rgba(255,255,255,0.7); display: inline-block; padding: 5px 13px; border-radius: 99px; }
.speak-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-mic { background: var(--grad-warm); color: #fff; font-weight: 800; font-size: 1rem; padding: 14px 30px; border-radius: 99px; box-shadow: 0 8px 22px rgba(255,93,143,0.4); transition: all .2s; display: inline-flex; align-items: center; gap: 9px; }
.btn-mic:hover { transform: translateY(-2px); }
.btn-mic.rec { animation: micPulse 1.2s ease-in-out infinite; }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,93,143,0.5); } 50% { box-shadow: 0 0 0 18px rgba(255,93,143,0); } }
.mic-status { text-align: center; color: var(--muted); font-size: 0.9rem; min-height: 1.4em; margin-top: 14px; }
.mic-heard { text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary-deep); margin-top: 6px; min-height: 1.5em; }
.self-rate { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.self-rate button { padding: 10px 16px; border-radius: 11px; border: 1.5px solid var(--line); background: #fff; font-weight: 700; font-size: 0.88rem; }
.self-rate button:hover { border-color: var(--primary); color: var(--primary); }

/* 完成页 */
.done-hero { text-align: center; padding: 8px 0 4px; }
.done-hero .dh-ic { font-size: 3.4rem; animation: bob 1.6s ease-in-out infinite; }
.done-hero h2 { font-size: 1.6rem; margin-top: 10px; }
.done-hero p { color: var(--muted); margin-top: 8px; }
.score-rings { display: flex; justify-content: center; gap: 26px; margin: 24px 0; flex-wrap: wrap; }
.score-ring { text-align: center; }
.score-ring .lbl { font-size: 0.82rem; color: var(--muted); font-weight: 700; margin-top: 6px; }
.xp-banner { display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #FFF3E0, #FFE6EE); padding: 14px; border-radius: 14px; font-weight: 800; color: #B4531B; font-size: 1.05rem; }
.ach-pop { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #EEEBFF, #FDF0FF); border: 1.5px solid #DCD3FF; padding: 13px 16px; border-radius: 14px; margin-top: 14px; animation: popIn .4s cubic-bezier(.2,1.4,.4,1); }
.ach-pop .ap-ic { font-size: 1.8rem; }
.ach-pop .ap-t { font-weight: 800; }
.ach-pop .ap-d { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

/* ---------- 进度页 ---------- */
.progress-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
.skill-bars { display: flex; flex-direction: column; gap: 14px; }
.skill-bar .sb-head { display: flex; justify-content: space-between; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; }
.skill-bar .sb-head span:last-child { color: var(--muted); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 13px; }
.ach-card { background: var(--card); border-radius: 16px; padding: 17px 14px; text-align: center; box-shadow: var(--shadow); border: 1.5px solid transparent; transition: all .2s; }
.ach-card.unlocked { border-color: #FFD98E; background: linear-gradient(160deg, #FFFBF2, #FFF6E4); }
.ach-card .a-ic { font-size: 2rem; filter: grayscale(1); opacity: .45; }
.ach-card.unlocked .a-ic { filter: none; opacity: 1; }
.ach-card .a-name { font-weight: 800; font-size: 0.9rem; margin-top: 8px; }
.ach-card .a-desc { color: var(--muted); font-size: 0.76rem; margin-top: 4px; line-height: 1.5; }
.ach-card .a-date { font-size: 0.72rem; color: var(--orange); font-weight: 700; margin-top: 5px; }
.lang-progress-row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px dashed var(--line); }
.lang-progress-row:last-child { border-bottom: none; }
.lpr-flag { font-size: 1.5rem; }
.lpr-body { flex: 1; }
.lpr-head { display: flex; justify-content: space-between; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; }
.lpr-head span:last-child { color: var(--muted); font-weight: 600; }

/* ---------- 社区 ---------- */
.community-grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
.post-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 15px; }
.post-head { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.post-author { font-weight: 700; font-size: 0.92rem; }
.post-time { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.post-lang { margin-left: auto; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--bg); color: var(--muted); }
.post-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; line-height: 1.5; }
.post-content { color: #454A63; font-size: 0.93rem; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.post-actions { display: flex; gap: 18px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
.post-actions button { display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 700; font-size: 0.87rem; transition: color .15s; }
.post-actions button:hover { color: var(--primary); }
.post-actions button.liked { color: var(--red); }
.comments { margin-top: 13px; display: flex; flex-direction: column; gap: 10px; }
.comment { background: var(--bg); border-radius: 12px; padding: 11px 14px; }
.comment .c-head { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; }
.comment .c-head b { color: var(--ink); }
.comment .c-body { font-size: 0.89rem; line-height: 1.65; }
.comment-input { display: flex; gap: 9px; margin-top: 12px; }
.comment-input input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; outline: none; background: #FAFBFF; }
.comment-input input:focus { border-color: var(--primary); }
.community-side .side-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 15px; }
.side-card h4 { font-size: 0.95rem; margin-bottom: 12px; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 0.88rem; font-weight: 600; }
.rank-row .rk { width: 22px; height: 22px; border-radius: 7px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; color: var(--muted); }
.rank-row:nth-child(1) .rk { background: #FFE9C7; color: #B4531B; }
.rank-row:nth-child(2) .rk { background: #EDEDF2; color: #62667E; }
.rank-row:nth-child(3) .rk { background: #FFE3D6; color: #B4531B; }
.filter-chips { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.chip { padding: 8px 15px; border-radius: 99px; background: #fff; border: 1.5px solid var(--line); font-weight: 700; font-size: 0.85rem; color: var(--muted); transition: all .15s; }
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.active { background: var(--grad); color: #fff; border-color: transparent; }

/* ---------- 个人页 ---------- */
.profile-head { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
.profile-avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 2.6rem; box-shadow: 0 10px 26px rgba(108,92,231,0.4); }
.profile-name { font-size: 1.5rem; font-weight: 800; }
.profile-mail { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
.avatar-picker { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.avatar-picker button { width: 46px; height: 46px; border-radius: 50%; font-size: 1.4rem; background: var(--bg); border: 2px solid transparent; transition: all .15s; }
.avatar-picker button:hover { transform: scale(1.1); }
.avatar-picker button.sel { border-color: var(--primary); background: var(--primary-soft); }
.goal-picker { display: flex; gap: 10px; }
.goal-picker button { flex: 1; padding: 13px; border-radius: 13px; border: 2px solid var(--line); background: #fff; font-weight: 800; transition: all .15s; }
.goal-picker button.sel { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.settings-row { margin-bottom: 22px; }
.settings-row h4 { margin-bottom: 10px; font-size: 0.98rem; }

/* ---------- 空状态 / 动画 ---------- */
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty .e-ic { font-size: 3rem; margin-bottom: 12px; }
.fade-in { animation: fadeUp .35s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.spin { display: inline-block; width: 22px; height: 22px; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .dash-grid, .progress-grid, .community-grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 2.1rem; }
  .nav-links { display: none; }
}
@media (max-width: 560px) {
  .phase-card { padding: 20px 16px; min-height: 340px; }
  .stat-row { grid-template-columns: 1fr 1fr; }
  .page { padding: 20px 14px 70px; }
  .hero { padding: 54px 16px 44px; }
}

  <script>/* LingoVerse 离线数据层：localStorage 持久化 + 完整 API 模拟
   与 server.js 的接口行为保持一致，供单文件离线版使用 */
window.API = (() => {
  const TOKEN_KEY = 'lv_token';
  const DB_KEY = 'lv_offline_db_v1';
  const SEED = window.__LV_SEED__;

  const LANGUAGES = SEED.languages;
  const LEVELS = SEED.levels;
  const ACHIEVEMENTS = SEED.achievements;
  const COURSES = SEED.courses;

  const LESSONS = {}, COURSE_OF = {}, VOCAB_INDEX = {};
  for (const c of COURSES) {
    for (const l of c.lessons) {
      LESSONS[l.id] = l;
      COURSE_OF[l.id] = c;
      VOCAB_INDEX[l.id] = (l.vocab || []).map(v => ({ term: v.t, lang: c.lang }));
    }
  }
  const LANG_MAP = Object.fromEntries(LANGUAGES.map(l => [l.code, l]));
  const ACH_MAP = Object.fromEntries(ACHIEVEMENTS.map(a => [a.id, a]));

  /* ---------------- 工具 ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const nowISO = () => new Date().toISOString();

  const K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ];
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  function sha256(msg) {
    const bytes = new TextEncoder().encode(msg);
    const blocks = new Uint8Array((Math.floor((bytes.length + 8) / 64) + 1) * 64);
    blocks.set(bytes);
    blocks[bytes.length] = 0x80;
    const dv = new DataView(blocks.buffer);
    const bitLen = bytes.length * 8;
    dv.setUint32(blocks.length - 4, bitLen >>> 0);
    dv.setUint32(blocks.length - 8, Math.floor(bitLen / 4294967296));
    const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Uint32Array(64);
    for (let off = 0; off < blocks.length; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map(x => x.toString(16).padStart(8, '0')).join('');
  }
  function randomHex(len) {
    const a = new Uint8Array(len);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (let i = 0; i < len; i++) a[i] = Math.floor(Math.random() * 256);
    return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
  }
  function hashPassword(pwd, salt) {
    let h = salt + ':' + pwd;
    for (let i = 0; i < 600; i++) h = sha256(h);
    return h;
  }
  function makeCredentials(pwd) {
    const salt = randomHex(12);
    return { salt, passwordHash: hashPassword(pwd, salt) };
  }

  /* ---------------- 存储 ---------------- */
  const memory = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return memory[k] ?? null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { memory[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch { delete memory[k]; } },
  };
  const getToken = () => store.get(TOKEN_KEY);
  const setToken = t => t ? store.set(TOKEN_KEY, t) : store.del(TOKEN_KEY);

  let db = null;
  function emptyDb() {
    return { users: [], tokens: {}, progress: {}, posts: [], nextIds: { user: 1, post: 1, comment: 1 } };
  }
  function save() { store.set(DB_KEY, JSON.stringify(db)); }
  function nextId(kind) { const id = db.nextIds[kind] || 1; db.nextIds[kind] = id + 1; save(); return id; }

  function newProgress() {
    return {
      xp: 0, streak: 0, lastActive: null, daily: [],
      lessons: {}, vocab: {},
      counts: { completions: 0, perfect: 0, speak90: 0, listen90: 0 },
      achievements: {},

  }

  function seedDatabase() {

    const cred = makeCredentials('demo1234');

      targetLanguage: 'en', dailyGoal: 50, createdAt: nowISO(), ...cred,

    const mates = [
      { username: '东京速递员', email: 'tokyo@demo.app', avatar: '🗾' },
      { username: 'SeoulRain', email: 'seoul@demo.app', avatar: '🌧️' },
    ];
    mates.forEach((m, i) => {
      db.users.push({ id: i + 2, ...m, targetLanguage: i ? 'ko' : 'ja', dailyGoal: 50, createdAt: nowISO(), ...makeCredentials(randomHex(8)) });
    });
    db.nextIds.user = 4;

    const p = db.progress[1] = newProgress();
    p.lessons = {
      'en-a1-c1-l1': { scores: { vocab: 92, grammar: 88, listening: 85, speaking: 76 }, completedAt: daysAgo(6), times: 1 },
      'en-a1-c1-l2': { scores: { vocab: 85, grammar: 90, listening: 80, speaking: 72 }, completedAt: daysAgo(5), times: 1 },
      'en-a1-c1-l3': { scores: { vocab: 88, grammar: 84, listening: 90, speaking: 78 }, completedAt: daysAgo(4), times: 1 },
      'ja-a1-c1-l1': { scores: { vocab: 80, grammar: 75, listening: 70, speaking: 65 }, completedAt: daysAgo(2), times: 1 },
      'ko-a1-c1-l1': { scores: { vocab: 95, grammar: 90, listening: 88, speaking: 82 }, completedAt: daysAgo(1), times: 1 },
    };
    p.counts.completions = 5; p.counts.listen90 = 1;
    for (const lid of Object.keys(p.lessons)) for (const v of VOCAB_INDEX[lid]) p.vocab[v.lang + ':' + v.term] = true;
    p.xp = 322; p.streak = 4; p.lastActive = daysAgo(1);
    p.daily = [
      { d: daysAgo(6), xp: 55 }, { d: daysAgo(5), xp: 48 }, { d: daysAgo(4), xp: 52 },
      { d: daysAgo(2), xp: 42 }, { d: daysAgo(1), xp: 60 }, { d: daysAgo(9), xp: 65 },
    ];
    p.achievements = { first_lesson: daysAgo(6), lessons_5: daysAgo(1), streak_3: daysAgo(2) };

    const now = Date.now(), iso = h => new Date(now - h * 3600e3).toISOString();
    db.posts = [
      { id: 1, userId: 2, lang: 'ja', title: '五十音记不住？我的平假名记忆法', content: '把每个假名配一个具体画面：「あ」像一位伸懒腰的阿姨…睡前默写一遍，一周就熟了。评论区交流呀！', likes: [1, 3], comments: [{ id: 1, userId: 1, content: '这个方法好用！昨晚试了记住了三个。', createdAt: iso(5) }], createdAt: iso(26) },
      { id: 2, userId: 3, lang: 'ko', title: '追《请回答1988》学韩语，双倍快乐', content: '第一遍看剧情，第二遍跟读台词。德善的「어머」我都条件反射了哈哈。想组队打卡的举手！', likes: [1, 2], comments: [{ id: 2, userId: 1, content: '举手！我从 A1-1 开始追。', createdAt: iso(3) }], createdAt: iso(20) },

  function load() {
    if (db) return db;
    const raw = store.get(DB_KEY);
    if (raw) {
      try { db = JSON.parse(raw); } catch { db = null; }
    }
    if (!db) { seedDatabase(); return db; }
    const empty = emptyDb();
    for (const k of Object.keys(empty)) if (db[k] === undefined) db[k] = empty[k];
    return db;

  /* ---------------- 进度逻辑 ---------------- */
  function getProgress(userId) {
    const d = load();
    if (!d.progress[userId]) d.progress[userId] = newProgress();
    return d.progress[userId];
  }
  function addXp(p, amount) {
