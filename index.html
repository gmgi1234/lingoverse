    p.xp += amount;
    const rec = p.daily.find(e => e.d === t);
    if (rec) rec.xp += amount; else p.daily.push({ d: t, xp: amount });
    if (p.lastActive !== t) {
      p.streak = (p.lastActive === daysAgo(1)) ? p.streak + 1 : 1;
      p.lastActive = t;
    }
    p.daily = p.daily.slice(-60);
  }
  const levelFromXp = xp => Math.floor(Math.sqrt(xp / 40)) + 1;
  const wordsLearned = p => Object.keys(p.vocab).length;

  function checkAchievements(p, userId) {
    const unlocked = [];
    const give = id => { if (!p.achievements[id]) { p.achievements[id] = nowISO(); unlocked.push(ACH_MAP[id]); } };
    const c = p.counts, w = wordsLearned(p);
    if (c.completions >= 1) give('first_lesson');
    if (c.completions >= 5) give('lessons_5');
    if (c.completions >= 15) give('lessons_15');
    if (p.xp >= 500) give('xp_500');
    if (p.xp >= 2000) give('xp_2000');
    if (p.streak >= 3) give('streak_3');
    if (p.streak >= 7) give('streak_7');
    if (w >= 50) give('vocab_50');
    if (c.perfect >= 1) give('perfect_lesson');
    if (c.speak90 >= 3) give('speaker');
    if (c.listen90 >= 3) give('listener');
    if (userId && load().posts.some(x => x.userId === userId)) give('social_1');
    return unlocked;
  }

  function lessonLangStats(p, lang) {
    const skills = { vocab: [], grammar: [], listening: [], speaking: [] };
    let done = 0, total = 0;
    for (const c of COURSES) {
      if (c.lang !== lang) continue;
      for (const l of c.lessons) {
        total++;
        const rec = p.lessons[l.id];
        if (rec) {
          done++;
          skills.vocab.push(rec.scores.vocab);
          skills.grammar.push(rec.scores.grammar);
          skills.listening.push(rec.scores.listening);
          skills.speaking.push(rec.scores.speaking);
        }
      }
    }
    const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
    return {
      lessonsDone: done, lessonsTotal: total,
      skills: { vocab: avg(skills.vocab), grammar: avg(skills.grammar), listening: avg(skills.listening), speaking: avg(skills.speaking) },
      words: Object.keys(p.vocab).filter(k => k.startsWith(lang + ':')).length,
    };
  }
  function progressSummary(p) {
    return {
      xp: p.xp, level: levelFromXp(p.xp), streak: p.streak,
      todayXp: (p.daily.find(e => e.d === todayStr()) || { xp: 0 }).xp,
      wordsLearned: wordsLearned(p), completions: p.counts.completions,
    };
  }

  /* ---------------- 会话 ---------------- */
  function currentUser() {
    const token = getToken();
    if (!token) return null;
    const d = load();
    const rec = d.tokens[token];
    if (!rec || (rec.exp && Date.now() > rec.exp)) return null;
    return d.users.find(u => u.id === rec.userId) || null;
  }
  function issueToken(userId) {
    const token = randomHex(24);
    load().tokens[token] = { userId, exp: Date.now() + 30 * 86400e3 };
    save();
    return token;
  }
  function publicUser(u) {
    return { id: u.id, username: u.username, avatar: u.avatar, targetLanguage: u.targetLanguage, dailyGoal: u.dailyGoal };
  }
  function fail(code, msg) {
    if (code === 401 && getToken()) {
      setToken(null);
      window.App && window.App.onAuthLost && window.App.onAuthLost();
    }
    throw new Error(msg);
  }

  /* ---------------- 接口实现 ---------------- */
  function api(method, pathname, body, query) {
    const user = currentUser();

    if (method === 'POST' && pathname === '/api/auth/register') {
      const { username, email, password } = body;
      if (!username || !email || !password) return fail(400, '请填写完整信息');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail(400, '邮箱格式不正确');
      if (String(password).length < 6) return fail(400, '密码至少 6 位');
      if (String(username).length > 20) return fail(400, '用户名过长');
      const d = load();
      if (d.users.some(u => u.email === email)) return fail(409, '该邮箱已注册');
      const avatars = ['🐣', '🦊', '🐼', '🦉', '🐳', '🦄', '🐝', '🐙', '🌸', '🚀'];
      const u = {
        id: nextId('user'), username, email, avatar: avatars[d.users.length % avatars.length],
        targetLanguage: 'en', dailyGoal: 50, createdAt: nowISO(), ...makeCredentials(password),
      };
      d.users.push(u);
      d.progress[u.id] = newProgress();
      save();
      return { status: 201, data: { token: issueToken(u.id), user: publicUser(u) } };
    }

    if (method === 'POST' && pathname === '/api/auth/login') {
      const { email, password } = body;
      const d = load();
      const u = d.users.find(x => x.email === email);
      if (!u || u.passwordHash !== hashPassword(password || '', u.salt)) return fail(401, '邮箱或密码不正确');
      return { status: 200, data: { token: issueToken(u.id), user: publicUser(u) } };
    }

    if (method === 'POST' && pathname === '/api/auth/logout') {
      if (getToken()) { delete load().tokens[getToken()]; save(); }
      return { status: 200, data: { ok: true } };
    }

    if (method === 'GET' && pathname === '/api/me') {
      if (!user) return fail(401, '请先登录');
      return { status: 200, data: { user: { ...publicUser(user), email: user.email }, progress: progressSummary(getProgress(user.id)) } };
    }

    if (method === 'PATCH' && pathname === '/api/me') {
      if (!user) return fail(401, '请先登录');
      if (body.targetLanguage && LANG_MAP[body.targetLanguage]) user.targetLanguage = body.targetLanguage;
      if (body.dailyGoal && [30, 50, 100].includes(body.dailyGoal)) user.dailyGoal = body.dailyGoal;
      if (body.username && String(body.username).trim()) user.username = String(body.username).trim().slice(0, 20);
      if (body.avatar && String(body.avatar).trim()) user.avatar = String(body.avatar).trim().slice(0, 4);
      save();
      return { status: 200, data: { user: publicUser(user) } };
    }

    if (method === 'GET' && pathname === '/api/catalog') {
      const p = user ? getProgress(user.id) : null;
      const courses = COURSES.map(c => ({
        id: c.id, lang: c.lang, level: c.level, title: c.title, subtitle: c.subtitle, icon: c.icon,
        lessonCount: c.lessons.length,
        doneCount: p ? c.lessons.filter(l => p.lessons[l.id]).length : 0,
      }));
      return { status: 200, data: { languages: LANGUAGES, levels: LEVELS, courses } };
    }

    let m = pathname.match(/^\/api\/courses\/([\w-]+)$/);
    if (method === 'GET' && m) {
      const course = COURSES.find(c => c.id === m[1]);
      if (!course) return fail(404, '课程不存在');
      const p = user ? getProgress(user.id) : null;
      return {
        status: 200, data: {
          course: {
            id: course.id, lang: course.lang, level: course.level, title: course.title,
            subtitle: course.subtitle, icon: course.icon,
            langMeta: LANG_MAP[course.lang], levelMeta: LEVELS[course.level],
            lessons: course.lessons.map(l => ({
              id: l.id, title: l.title, subtitle: l.subtitle, icon: l.icon, minutes: l.minutes,
              completed: !!(p && p.lessons[l.id]),
              bestScore: p && p.lessons[l.id] ? Math.round((p.lessons[l.id].scores.vocab + p.lessons[l.id].scores.grammar + p.lessons[l.id].scores.listening + p.lessons[l.id].scores.speaking) / 4) : null,
            })),
          },
        },
      };
    }

    m = pathname.match(/^\/api\/lessons\/([\w-]+)$/);
    if (method === 'GET' && m) {
      const lesson = LESSONS[m[1]];
      if (!lesson) return fail(404, '课时不存在');
      const course = COURSE_OF[lesson.id];
      const p = user ? getProgress(user.id) : null;
      const idx = course.lessons.findIndex(l => l.id === lesson.id);
      return {
        status: 200, data: {
          lesson: { ...lesson, lang: course.lang, courseTitle: course.title },
          langMeta: LANG_MAP[course.lang],
          prev: idx > 0 ? course.lessons[idx - 1].id : null,
          next: idx < course.lessons.length - 1 ? course.lessons[idx + 1].id : null,
          best: p && p.lessons[lesson.id] ? p.lessons[lesson.id].scores : null,
        },
      };
    }

    m = pathname.match(/^\/api\/lessons\/([\w-]+)\/complete$/);
    if (method === 'POST' && m) {
      if (!user) return fail(401, '请先登录');
      const lesson = LESSONS[m[1]];
      if (!lesson) return fail(404, '课时不存在');
      const s = body.scores || {};
      const clamp = n => Math.max(0, Math.min(100, Math.round(Number(n) || 0)));
      const scores = { vocab: clamp(s.vocab), grammar: clamp(s.grammar), listening: clamp(s.listening), speaking: clamp(s.speaking) };
      const avg = (scores.vocab + scores.grammar + scores.listening + scores.speaking) / 4;
      const xp = 30 + Math.round(avg / 100 * 30);

      const p = getProgress(user.id);
      const prev = p.lessons[lesson.id];
      const firstTime = !prev;
      const rec = {
        scores: Object.fromEntries(Object.entries(scores).map(([k, v]) => [k, prev ? Math.max(prev.scores[k], v) : v])),
        completedAt: nowISO(), times: (prev ? prev.times : 0) + 1,
        speakerCounted: (prev && prev.speakerCounted) || scores.speaking >= 90,
        listenCounted: (prev && prev.listenCounted) || scores.listening >= 90,
      };
      p.lessons[lesson.id] = rec;
      if (firstTime) {
        p.counts.completions++;
        for (const v of VOCAB_INDEX[lesson.id]) p.vocab[v.lang + ':' + v.term] = true;
      }
      if (Object.values(scores).every(v => v >= 90)) p.counts.perfect++;
      if (scores.speaking >= 90 && !(prev && prev.speakerCounted)) p.counts.speak90++;
      if (scores.listening >= 90 && !(prev && prev.listenCounted)) p.counts.listen90++;
      addXp(p, xp);
      const unlocked = checkAchievements(p, user.id);
      save();
      return { status: 200, data: { xpGained: xp, ...progressSummary(p), newAchievements: unlocked, firstTime } };
    }

    if (method === 'GET' && pathname === '/api/progress') {
      if (!user) return fail(401, '请先登录');
      const p = getProgress(user.id);
      const languages = {};
      for (const l of LANGUAGES) languages[l.code] = lessonLangStats(p, l.code);
      const daily = [];
      for (let i = 6; i >= 0; i--) {
        const t = daysAgo(i);
        daily.push({ d: t, xp: (p.daily.find(e => e.d === t) || { xp: 0 }).xp });
      }
      return {
        status: 200, data: {
          ...progressSummary(p), daily, languages, dailyGoal: user.dailyGoal,
          achievements: ACHIEVEMENTS.map(a => ({ ...a, unlockedAt: p.achievements[a.id] || null })),
        },
      };
    }

    if (method === 'GET' && pathname === '/api/recommendations') {
      if (!user) return fail(401, '请先登录');
      const p = getProgress(user.id);
      const recs = [];
      const doneLangs = Object.keys(p.lessons).map(id => COURSE_OF[id].lang);
      const mainLang = doneLangs[doneLangs.length - 1] || user.targetLanguage || 'en';
      const langMeta = LANG_MAP[mainLang];
      const langCourses = COURSES.filter(c => c.lang === mainLang);
      let nextLesson = null, nextCourse = null;
      for (const c of langCourses) {
        for (const l of c.lessons) if (!p.lessons[l.id]) { nextLesson = l; nextCourse = c; break; }
        if (nextLesson) break;
      }
      if (nextLesson) {
        recs.push({
          type: 'lesson', lang: mainLang, courseId: nextCourse.id, lessonId: nextLesson.id,
          title: nextLesson.title, desc: `${nextCourse.title} · ${nextLesson.subtitle}`,
          icon: nextLesson.icon, reason: `继续你的${langMeta.name}课程，保持连续学习！`,
        });
      } else {
        recs.push({ type: 'congrats', lang: mainLang, icon: '🎉', title: `${langMeta.name}课程全部完成！`, desc: '去课程页看看其他语种，解锁新地图吧', reason: '该语种所有课时已完成' });
      }
      const st = lessonLangStats(p, mainLang);
      const skillNames = { vocab: '单词记忆', grammar: '语法练习', listening: '听力训练', speaking: '口语跟读' };
      const valid = Object.entries(st.skills).filter(([, v]) => v !== null);
      if (valid.length) {
        const [weakSkill, weakScore] = valid.sort((a, b) => a[1] - b[1])[0];
        if (weakScore < 90) {
          recs.push({
            type: 'practice', skill: weakSkill, lang: mainLang,
            title: skillNames[weakSkill] + '强化',
            desc: `当前均分 ${weakScore} 分`,
            icon: { vocab: '🧠', grammar: '✍️', listening: '🎧', speaking: '🎙️' }[weakSkill],
            reason: `${skillNames[weakSkill]}是你的薄弱项，回到课时重练一遍吧`,
          });
        }
      }
      const t = todayStr();
      const todayXp = (p.daily.find(e => e.d === t) || { xp: 0 }).xp;
      if (todayXp < user.dailyGoal) {
        recs.push({ type: 'goal', icon: '🎯', title: `今日目标还差 ${user.dailyGoal - todayXp} XP`, desc: '再完成一节课就能达标', reason: `每日目标 ${user.dailyGoal} XP，已完成 ${todayXp}` });
      } else {
        recs.push({ type: 'goal', icon: '✅', title: '今日目标已达成！', desc: `今天已获得 ${todayXp} XP，明天见`, reason: '超额完成，休息一下也可以' });
      }
      const other = LANGUAGES.find(l => l.code !== mainLang && !lessonLangStats(p, l.code).lessonsDone);
      if (other) {
        const firstCourse = COURSES.find(c => c.lang === other.code && c.level === 'A1');
        recs.push({ type: 'explore', lang: other.code, courseId: firstCourse.id, lessonId: firstCourse.lessons[0].id, icon: other.flag, title: `试试${other.name}？`, desc: firstCourse.title, reason: '多语种学习者记忆效果更好' });
      }
      return { status: 200, data: { recommendations: recs, mainLang } };
    }

    if (method === 'GET' && pathname === '/api/community') {
      const d = load();
      let posts = [...d.posts].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      const lang = query.get('lang');
      if (lang) posts = posts.filter(x => x.lang === lang);
      const users = Object.fromEntries(d.users.map(u => [u.id, { id: u.id, username: u.username, avatar: u.avatar }]));
      posts = posts.slice(0, 50).map(x => ({
        id: x.id, lang: x.lang, title: x.title, content: x.content, createdAt: x.createdAt,
        author: users[x.userId] || { username: '已注销', avatar: '👤' },
        likes: x.likes.length, liked: user ? x.likes.includes(user.id) : false,
        comments: x.comments.map(c => ({ ...c, author: users[c.userId] || { username: '已注销', avatar: '👤' } })),
      }));
      return { status: 200, data: { posts } };
    }

    if (method === 'POST' && pathname === '/api/community') {
      if (!user) return fail(401, '请先登录');
      const { lang, title, content } = body;
      if (!title || !content) return fail(400, '标题和内容不能为空');
      const d = load();
      const post = {
        id: nextId('post'), userId: user.id,
        lang: LANG_MAP[lang] ? lang : 'multi',
        title: String(title).slice(0, 60), content: String(content).slice(0, 2000),
        likes: [], comments: [], createdAt: nowISO(),
      };
      d.posts.unshift(post);
      const p = getProgress(user.id);
      const unlocked = checkAchievements(p, user.id);
      save();
      return { status: 201, data: { post: { ...post, author: publicUser(user), likes: 0, liked: false, comments: [] }, newAchievements: unlocked } };
    }

    m = pathname.match(/^\/api\/community\/(\d+)\/like$/);
    if (method === 'POST' && m) {
      if (!user) return fail(401, '请先登录');
      const d = load();
      const post = d.posts.find(x => x.id === Number(m[1]));
      if (!post) return fail(404, '帖子不存在');
      const i = post.likes.indexOf(user.id);
      if (i >= 0) post.likes.splice(i, 1); else post.likes.push(user.id);
      save();
      return { status: 200, data: { likes: post.likes.length, liked: i < 0 } };
    }

    m = pathname.match(/^\/api\/community\/(\d+)\/comment$/);
    if (method === 'POST' && m) {
      if (!user) return fail(401, '请先登录');
      const d = load();
      const post = d.posts.find(x => x.id === Number(m[1]));
      if (!post) return fail(404, '帖子不存在');
      const content = String(body.content || '').trim();
      if (!content) return fail(400, '评论不能为空');
      const comment = { id: nextId('comment'), userId: user.id, content: content.slice(0, 500), createdAt: nowISO() };
      post.comments.push(comment);
      save();
      return { status: 201, data: { comment: { ...comment, author: publicUser(user) } } };
    }

    if (method === 'GET' && pathname === '/api/achievements') {
      const p = user ? getProgress(user.id) : null;
      return {
        status: 200, data: {
          achievements: ACHIEVEMENTS.map(a => ({ ...a, unlockedAt: p ? p.achievements[a.id] || null : null })),
        },
      };
    }

    return fail(404, '接口不存在');
  }

  async function request(method, path, body) {
    const [pathname, qs] = String(path).split('?');
    const query = new URLSearchParams(qs || '');
    await new Promise(r => setTimeout(r, 0));
    const { data } = api(method, pathname, body || {}, query);
    return data;
  }

  return {
    getToken, setToken,
    get: p => request('GET', p),
    post: (p, b) => request('POST', p, b),
    patch: (p, b) => request('PATCH', p, b),
  };
})();
</script>
  <script>/* LingoVerse 轻量 SVG 图表 */
window.Charts = (() => {
  /* 周活动柱状图：days = [{d:'MM-DD', xp}] */
  function weekChart(days, goal) {
    const w = 100, h = 40;
    const max = Math.max(goal || 50, ...days.map(x => x.xp), 1);
    const bw = w / days.length * 0.52, gap = w / days.length;
    let bars = '';
    days.forEach((x, i) => {
      const bh = Math.max(x.xp / max * (h - 6), x.xp > 0 ? 4 : 2);
      const bx = i * gap + (gap - bw) / 2;
      const fill = x.xp >= (goal || Infinity) ? 'url(#gg)' : (x.xp > 0 ? '#A99BFF' : '#E4E6F2');
      bars += `<rect x="${bx.toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${fill}"/>`;
      bars += `<text x="${(i * gap + gap / 2).toFixed(1)}" y="${h + 8}" font-size="5.2" fill="#9CA0B8" text-anchor="middle">${x.d.slice(5)}</text>`;
    });
    const goalY = (h - (goal || 50) / max * (h - 6)).toFixed(1);
    return `<svg viewBox="0 0 ${w} ${h + 12}" style="width:100%;display:block">
      <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>
      <line x1="0" y1="${goalY}" x2="${w}" y2="${goalY}" stroke="#FFB020" stroke-width="0.8" stroke-dasharray="2.5 2.5" opacity="0.8"/>
      ${bars}</svg>`;
  }

  /* 进度环：percent 0-100, size px */
  function ring(percent, size = 74, color = 'url(#rg)', track = '#EEF0F8', label = null) {
    const r = (size - 10) / 2, c = 2 * Math.PI * r;
    const p = Math.max(0, Math.min(100, percent));
    const off = c * (1 - p / 100);
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="7"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .8s ease"/>
      <text x="50%" y="${label ? '46%' : '54%'}" dominant-baseline="middle" text-anchor="middle" font-size="${size * 0.26}" font-weight="800" fill="#1E2235">${Math.round(p)}</text>
      ${label ? `<text x="50%" y="66%" text-anchor="middle" font-size="${size * 0.14}" fill="#9CA0B8">${label}</text>` : ''}
    </svg>`;
  }

  /* 得分环（课程完成页用） */
  function scoreRing(score, icon, name) {
    const color = score >= 90 ? '#23B37D' : score >= 60 ? '#FF9F43' : '#F0574F';
    const r = 34, c = 2 * Math.PI * r;
    const off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="score-ring">
      <svg width="84" height="84" viewBox="0 0 84 84">
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="#EEF0F8" stroke-width="8"/>
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 42 42)" style="transition:stroke-dashoffset .9s ease"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="19" font-weight="800" fill="${color}">${Math.round(score)}</text>
      </svg>
      <div class="lbl">${icon} ${name}</div>
    </div>`;
  }

  /* 技能条 */
  function skillBar(name, icon, score) {
    const color = score >= 90 ? '#23B37D' : score >= 60 ? '#6C5CE7' : '#FF9F43';
    return `<div class="skill-bar">
      <div class="sb-head"><span>${icon} ${name}</span><span>${score === null ? '未开始' : score + ' 分'}</span></div>
      <div class="progress-bar"><div style="width:${score || 0}%;background:${score >= 90 ? 'linear-gradient(90deg,#23B37D,#4ADE9C)' : 'linear-gradient(90deg,#6C5CE7,#A78BFA)'}"></div></div>
    </div>`;
  }

  return { weekChart, ring, scoreRing, skillBar };
})();
</script>
  <script>/* LingoVerse 应用核心：路由 / 布局 / 认证 / 落地页 / 仪表盘 */
window.App = (() => {
  const { get, post, patch, setToken, getToken } = API;

  const state = { user: null, progress: null, booted: false };

  // ---------- 工具 ----------
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = iso => { const d = new Date(iso); return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const timeAgo = iso => {
    const m = Math.floor((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return '刚刚'; if (m < 60) return m + ' 分钟前';
    const h = Math.floor(m / 60); if (h < 24) return h + ' 小时前';
    const d = Math.floor(h / 24); if (d < 30) return d + ' 天前';
    return fmtDate(iso);
  };
  const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
  const todayLabel = () => { const d = new Date(); return `${d.getMonth() + 1}月${d.getDate()}日 星期${weekDays[d.getDay()]}`; };

  function toast(msg, type = '') {
    const box = $('#toast-box');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⚠️' : '💡'}</span>${esc(msg)}`;
    box.appendChild(el);
    setTimeout(() => el.remove(), 2900);
  }
  function modal(html, opts = {}) {
    const root = $('#modal-root');
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `<div class="modal" style="max-width:${opts.width || 520}px">${html}</div>`;
    mask.addEventListener('click', e => { if (e.target === mask && !opts.static) close(); });
    root.appendChild(mask);
    function close() { mask.remove(); }
    return { close, el: mask };
  }
  const confirmModal = (text, onOk) => {
    const m = modal(`<h3>确认操作</h3><p style="color:var(--muted);margin-bottom:20px">${esc(text)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn-ghost" id="cm-no">取消</button>
        <button class="btn-primary" id="cm-ok" style="background:linear-gradient(135deg,#F0574F,#FF7B6E)">确定</button>
      </div>`);
    m.el.querySelector('#cm-no').onclick = m.close;
    m.el.querySelector('#cm-ok').onclick = () => { m.close(); onOk(); };
  };

  // ---------- 语音 ----------
  function speak(text, lang) {
    if (!('speechSynthesis' in window)) return toast('当前浏览器不支持语音合成', 'error');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 0.85;
    const voices = speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').startsWith(u.lang.slice(0, 2)));
    if (voices.length) u.voice = voices.find(v => v.lang.replace('_', '-') === u.lang) || voices[0];
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices(); // 预热

  // ---------- 认证 ----------
  async function loadMe() {
    if (!getToken()) { state.user = null; state.progress = null; return; }
    try {
      const data = await get('/api/me');
      state.user = data.user; state.progress = data.progress;
    } catch (e) { state.user = null; }
  }
  function onAuthLost() {
    state.user = null; state.progress = null;
    renderNav();
    toast('登录已过期，请重新登录', 'error');
    location.hash = '#/login';
  }
  async function logout() {
    try { await post('/api/auth/logout'); } catch (e) { /* ignore */ }
    setToken(null); state.user = null;
    toast('已退出登录', 'success');
    location.hash = '#/'; renderNav(); route();
  }

  // ---------- 导航 ----------
  function renderNav() {
    const el = $('#nav-slot');
    if (!el) return;
    const u = state.user;
    const p = state.progress;
    const cur = (location.hash || '#/').split('?')[0];
    const link = (href, label) => `<a class="nav-link ${cur === href ? 'active' : ''}" href="${href}">${label}</a>`;
    el.innerHTML = `
      <div class="nav">
        <div class="nav-inner">
          <a class="nav-logo" href="${u ? '#/' : '#/landing'}"><span class="globe">🌍</span><span>语界 <em>LingoVerse</em></span></a>
          <div class="nav-links">
            ${u ? link('#/', '学习首页') + link('#/courses', '分级课程') + link('#/progress', '学习进度') + link('#/community', '学习社区') : ''}
          </div>
          <div class="nav-right">
            ${u ? `
              <span class="nav-stat" title="连续学习天数">🔥 ${p ? p.streak : 0}</span>
              <span class="nav-stat xp" title="总经验值">⚡ ${p ? p.xp : 0} XP</span>
              <div class="nav-user">
                <div class="nav-avatar" id="nav-avatar">${esc(u.avatar || '🙂')}</div>
                <div class="nav-menu" id="nav-menu">
                  <div class="mhead">Lv.${p ? p.level : 1} · ${esc(u.username)}</div>
                  <a class="mi" href="#/profile">👤 个人设置</a>
                  <a class="mi" href="#/progress">📊 我的成就</a>
                  <button class="mi danger" id="btn-logout">🚪 退出登录</button>
                </div>
              </div>` : `
              <a class="btn-login" href="#/login">登录</a>
              <a class="btn-primary" href="#/register">免费注册</a>`}
          </div>
        </div>
      </div>`;
    const avatar = el.querySelector('#nav-avatar');
    if (avatar) {
      avatar.onclick = e => { e.stopPropagation(); el.querySelector('#nav-menu').classList.toggle('open'); };
      el.querySelector('#btn-logout').onclick = logout;
    }
  }
  document.addEventListener('click', () => { const m = $('#nav-menu'); if (m) m.classList.remove('open'); });

  // ---------- 路由 ----------
  const routes = [];
  const on = (pattern, view) => routes.push([pattern, view]);

  function route() {
    if (!state.booted) return;
    const hash = (location.hash || '#/').replace(/^#/, '') || '/';
    renderNav();
    window.scrollTo(0, 0);
    for (const [pattern, view] of routes) {
      const m = hash.match(pattern);
      if (m) { view(...m.slice(1)); return; }
    }
    location.hash = '#/';
  }
  window.addEventListener('hashchange', route);

  async function boot() {
    await loadMe();
    state.booted = true;
    // 未登录访问受限页 → 跳登录
    const hash = (location.hash || '#/').replace(/^#/, '') || '/';
    const needAuth = ['/', '/progress', '/community', '/profile'].includes(hash) || hash.startsWith('/courses') || hash.startsWith('/lesson');
    if (!state.user && needAuth) { location.hash = '#/login'; }
    route();
  }

  // ---------- 视图：落地页 ----------
  function viewLanding() {
    $('#app').innerHTML = `
      <div id="nav-slot"></div>
      <div class="hero">
        <div class="hero-blob b1"></div><div class="hero-blob b2"></div><div class="hero-blob b3"></div>
        <div class="hero-inner fade-in">
          <div class="hero-tag">✨ 沉浸式多语种学习平台</div>
          <h1>让每一门语言，<br/>都成为你<span class="hl">看世界的窗</span></h1>
          <p class="lead">英语 · 日语 · 韩语，科学分级课程体系 × 单词记忆 / 语法练习 / 口语跟读 / 听力训练四大互动模块，AI 语音评测助你开口流利说。</p>
          <div class="hero-cta">
            <a class="btn-primary" href="#/register">🚀 免费开始学习</a>
            <a class="btn-ghost" href="#/login">已有账号，直接登录</a>
          </div>
          <div class="hero-flags">🇬🇧 🇯🇵 🇰🇷</div>
        </div>
      </div>
      <div class="lang-strip fade-in">
        <div class="lang-card" style="background:linear-gradient(135deg,#4F8CFF,#6C5CE7)">
          <span class="courses">12 节课</span><div class="flag">🇬🇧</div><h3>英语 English</h3><div class="en">Hello → 职场邮件</div>
          <p>从问候语到国际职场表达，覆盖 A1-B1 三个等级，让英语成为你的全球通行证。</p>
        </div>
        <div class="lang-card" style="background:linear-gradient(135deg,#FF5D8F,#FF9A62)">
          <span class="courses">12 节课</span><div class="flag">🇯🇵</div><h3>日语 日本語</h3><div class="en">こんにちは → ビジネス敬語</div>
          <p>五十音起步，动漫旅行到商务敬语，一站式打通日语听说读写的任督二脉。</p>
        </div>
        <div class="lang-card" style="background:linear-gradient(135deg,#12B886,#37C99E)">
          <span class="courses">12 节课</span><div class="flag">🇰🇷</div><h3>韩语 한국어</h3><div class="en">안녕하세요 → 비즈니스</div>
          <p>Hangul 一周入门，从追剧追星到韩企面试，把韩流变成你的竞争力。</p>
        </div>
      </div>
      <div class="feature-grid fade-in">
        <div class="feature"><div class="ic">📚</div><h3>分级课程体系</h3><p>对标 CEFR 欧标 A1-B1，每门课 3-4 节浸入式课时，循序渐进不掉队。</p></div>
        <div class="feature"><div class="ic">🧠</div><h3>四大互动模块</h3><p>单词卡片、语法闯关、AI 听力训练、口语跟读评测，像玩游戏一样学习。</p></div>
        <div class="feature"><div class="ic">📈</div><h3>进度追踪</h3><p>XP 经验值、连续打卡、周活动曲线与技能雷达，成长看得见。</p></div>
        <div class="feature"><div class="ic">🏆</div><h3>社区与成就</h3><p>12 枚成就徽章等你解锁，与全球语伴分享心得、互相激励。</p></div>
      </div>
      <div id="nav-slot2" style="display:none"></div>`;
    renderNav();
  }

  // ---------- 视图：登录 / 注册 ----------
  function viewAuth(mode) {
    const isLogin = mode === 'login';
    $('#app').innerHTML = `
      <div id="nav-slot"></div>
      <div style="min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:30px 16px;background:linear-gradient(160deg,#EEEBFF 0%,#F5F6FB 40%,#E7F6F0 100%)">
        <div class="card fade-in" style="width:100%;max-width:420px;padding:34px">
          <div style="text-align:center;margin-bottom:24px">
            <div style="font-size:2.6rem">${isLogin ? '👋' : '🎉'}</div>
            <h2 style="margin-top:8px">${isLogin ? '欢迎回来' : '加入语界'}</h2>
            <p style="color:var(--muted);font-size:0.9rem;margin-top:6px">${isLogin ? '继续你的多语种学习之旅' : '注册即享全部三语种课程'}</p>
          </div>
          <form id="auth-form">
            ${isLogin ? '' : `<div class="field"><label>昵称</label><input name="username" placeholder="给自己起个响亮的名字" maxlength="20" required /></div>`}
            <div class="field"><label>邮箱</label><input name="email" type="email" placeholder="you@example.com" required /></div>
            <div class="field"><label>密码</label><input name="password" type="password" placeholder="${isLogin ? '你的密码' : '至少 6 位'}" required /></div>
            <div class="form-error" id="auth-err"></div>
            <button class="btn-primary btn-block" type="submit" id="auth-btn">${isLogin ? '登 录' : '注 册 并 开 始'}</button>
          </form>
          <p style="text-align:center;margin-top:18px;font-size:0.88rem;color:var(--muted)">
            ${isLogin ? `还没有账号？<a href="#/register" style="color:var(--primary);font-weight:700">免费注册</a>` : `已有账号？<a href="#/login" style="color:var(--primary);font-weight:700">直接登录</a>`}
          </p>
          ${isLogin ? `<div style="margin-top:16px;padding:12px 14px;border-radius:12px;background:#F5F6FB;font-size:0.82rem;color:var(--muted);line-height:1.7">💡 体验演示账号：<b>demo@lingoverse.app</b> / demo1234<br/>已带 4 天连续打卡记录与课程进度</div>` : ''}
        </div>
      </div>`;
    renderNav();
    $('#auth-form').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = $('#auth-btn'), errEl = $('#auth-err');
      btn.disabled = true; btn.textContent = '请稍候…'; errEl.textContent = '';
      try {
        const data = isLogin
          ? await post('/api/auth/login', { email: fd.get('email'), password: fd.get('password') })
          : await post('/api/auth/register', { username: fd.get('username'), email: fd.get('email'), password: fd.get('password') });
        setToken(data.token);
        state.user = data.user;
        await loadMe();
        toast(isLogin ? `欢迎回来，${data.user.username}！` : `欢迎加入语界，${data.user.username}！`, 'success');
        location.hash = '#/';
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false; btn.textContent = isLogin ? '登 录' : '注 册 并 开 始';
      }
    };
  }

  // ---------- 视图：学习仪表盘 ----------
  async function viewDashboard() {
    $('#app').innerHTML = `<div id="nav-slot"></div><div class="page"><div class="boot-splash" style="min-height:50vh"><div class="spin"></div></div></div>`;
    renderNav();
    let rec, prog;
    try {
      [rec, prog] = await Promise.all([API.get('/api/recommendations'), API.get('/api/progress')]);
    } catch (e) { return toast(e.message, 'error'); }
    const u = state.user, p = state.progress;
    const mainLang = rec.mainLang;
    const goalPct = Math.min(100, Math.round(prog.todayXp / prog.dailyGoal * 100));
    const hour = new Date().getHours();
    const hello = hour < 6 ? '夜深了' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 19 ? '下午好' : '晚上好';
    const recIcon = { lesson: '📖', practice: '💪', goal: '🎯', explore: '🗺️', congrats: '🎉' };

    $('#app').innerHTML = `
      <div id="nav-slot"></div>
      <div class="page">
        <div class="dash-welcome fade-in">
          <div>
            <div class="dash-hi">${hello}，<span>${esc(u.username)}</span> ${esc(u.avatar)}</div>
            <div class="dash-date">${todayLabel()} · 连续学习 ${prog.streak} 天，今天已获得 ${prog.todayXp} XP</div>
          </div>
        </div>

        <div class="stat-row fade-in">
          <div class="stat-card"><div class="ic" style="background:#EEEBFF">⚡</div><div><div class="num">${prog.xp}</div><div class="lbl">总经验 XP</div></div></div>
          <div class="stat-card"><div class="ic" style="background:#FFF1E3">🔥</div><div><div class="num">${prog.streak} 天</div><div class="lbl">连续打卡</div></div></div>
          <div class="stat-card"><div class="ic" style="background:#E9FBF3">🧠</div><div><div class="num">${prog.wordsLearned}</div><div class="lbl">已学单词</div></div></div>
          <div class="stat-card"><div class="ic" style="background:#EAF4FF">📚</div><div><div class="num">${prog.completions}</div><div class="lbl">完成课时</div></div></div>
        </div>

        <div class="dash-grid">
          <div class="card fade-in">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
              <h3 style="font-size:1.08rem">🎯 为你推荐</h3>
              <span style="font-size:0.82rem;color:var(--muted)">基于你的学习行为智能生成</span>
            </div>
            <div class="rec-list">
              ${(() => {
                const anyLesson = rec.recommendations.find(r => r.lessonId);
                const hrefOf = r => r.lessonId ? '#/lesson/' + r.lessonId
                  : r.type === 'practice' && anyLesson ? '#/lesson/' + anyLesson.lessonId : '#/courses';
                return rec.recommendations.map(r => `
                <div class="rec-item" data-href="${hrefOf(r)}">
                  <div class="ric">${r.icon || recIcon[r.type] || '✨'}</div>
                  <div style="flex:1;min-width:0">
                    <div class="rt">${esc(r.title)}</div>
                    <div class="rd">${esc(r.desc || '')}</div>
                    <div class="rr">${esc(r.reason || '')}</div>
                  </div>
                  <span class="go">›</span>
                </div>`).join('');
              })()}
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:18px">
            <div class="card fade-in">
              <h3 style="font-size:1.05rem;margin-bottom:12px">今日目标</h3>
              <div class="goal-ring-box">
                ${Charts.ring(goalPct, 108, 'url(#rg)', '#EEF0F8', 'XP')}
                <div class="ring-num">${prog.todayXp}<span style="font-size:0.9rem;color:var(--muted)"> / ${prog.dailyGoal} XP</span></div>
                <div class="ring-lbl">${goalPct >= 100 ? '🎉 今日目标已达成！' : goalPct >= 60 ? '马上就完成了，加油！' : '完成一节课即可快速达标'}</div>
                <a href="#/progress" style="font-size:0.83rem;color:var(--primary);font-weight:700;margin-top:4px">调整目标 ›</a>
              </div>
            </div>
            <div class="card fade-in">
              <h3 style="font-size:1.05rem;margin-bottom:10px">近 7 天学习热度</h3>
              <div class="week-chart">${Charts.weekChart(prog.daily, prog.dailyGoal)}</div>
            </div>
          </div>
        </div>
      </div>`;
    renderNav();
    document.querySelectorAll('.rec-item').forEach(el => el.onclick = () => location.hash = el.dataset.href);
  }

  // ---------- 注册路由 ----------
  on(/^\/landing$/, viewLanding);
  on(/^\/$/, () => (state.user ? viewDashboard() : viewLanding()));
  on(/^\/login$/, () => viewAuth('login'));
  on(/^\/register$/, () => viewAuth('register'));

  return {
    state, boot, route, renderNav, onAuthLost, on,
    toast, modal, confirmModal, speak, loadMe,
    esc, timeAgo, fmtDate,
    get $() { return $; },
    utils: { esc, timeAgo, fmtDate, toast, modal, confirmModal, speak, $ },
  };
})();

window.Views = window.Views || {};
window.LessonPlayer = window.LessonPlayer || {};
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => App.boot());
} else {
  App.boot();
}
</script>
  <script>/* LingoVerse 页面视图：课程 / 进度 / 社区 / 个人 */
(() => {
  const { get, post, patch } = API;
  const { esc, timeAgo, toast, modal, speak, $ } = App.utils;
  const { on } = App;
  let currentLang = 'en';

  // ================= 课程目录 =================
  on(/^\/courses$/, viewCourses);
  async function viewCourses() {
    $('#app').innerHTML = `<div id="nav-slot"></div><div class="page"><div class="boot-splash" style="min-height:40vh"><div class="spin"></div></div></div>`;
    App.renderNav();
    let data;
    try { data = await get('/api/catalog'); } catch (e) { return toast(e.message, 'error'); }
    const { languages, levels, courses } = data;

    function render() {
      const lang = languages.find(l => l.code === currentLang);
      const blocks = Object.keys(levels).map(lv => {
        const list = courses.filter(c => c.lang === currentLang && c.level === lv);
        if (!list.length) return '';
        return `<div class="level-block fade-in">
          <div class="level-head">
            <span class="level-badge" style="background:linear-gradient(135deg,${lang.color},${lang.color}CC)">${levels[lv].name}</span>
            <span class="level-name">${levels[lv].desc}</span>
          </div>
          <div class="course-grid">
            ${list.map(c => `
              <div class="course-card" data-id="${c.id}">
                <div class="cc-top">
                  <div class="cc-icon" style="background:${lang.color}1A">${c.icon}</div>
                  <div style="flex:1;min-width:0">
                    <h3>${esc(c.title)}</h3>
                    <div class="cc-sub">${esc(c.subtitle)}</div>
                  </div>
                </div>
                <div class="cc-bottom">
                  <div class="cc-meta"><span>📖 ${c.lessonCount} 节课</span><span>${c.doneCount}/${c.lessonCount} 已完成</span></div>
                  <div class="progress-bar ${c.doneCount >= c.lessonCount && c.lessonCount > 0 ? 'done' : ''}">
                    <div style="width:${c.lessonCount ? c.doneCount / c.lessonCount * 100 : 0}%"></div>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('');

      $('#app').innerHTML = `
        <div id="nav-slot"></div>
        <div class="page">
          <div class="page-head fade-in">
            <div>
              <div class="page-title">📚 分级课程</div>
              <div class="page-sub">对标 CEFR 欧标 · 选择一门语言开始你的进阶之路</div>
            </div>
          </div>
          <div class="lang-tabs fade-in">
            ${languages.map(l => `
              <button class="lang-tab ${l.code === currentLang ? 'active' : ''}" data-lang="${l.code}"
                style="${l.code === currentLang ? `background:linear-gradient(135deg,${l.color},${l.color}B3)` : ''}">
                <span style="font-size:1.15rem">${l.flag}</span>${l.name}
                <span style="opacity:.75;font-weight:600">${l.nativeName}</span>
              </button>`).join('')}
          </div>
          ${blocks}
        </div>`;
      App.renderNav();
      document.querySelectorAll('.lang-tab').forEach(b => b.onclick = () => { currentLang = b.dataset.lang; render(); });
      document.querySelectorAll('.course-card').forEach(c => c.onclick = () => location.hash = '#/courses/' + c.dataset.id);
    }
    render();

  <script>/* LingoVerse 互动式课程播放器
   流程：🧠 单词记忆 → ✍️ 语法练习 → 🎧 听力训练 → 🎙️ 口语跟读 → 🎉 完成 */
(() => {
  const { get, post } = API;
  const { esc, toast, speak, $ } = App.utils;
  const { on } = App;

  const PHASES = [
    { key: 'vocab', label: '🧠 单词', icon: '🧠' },
    { key: 'grammar', label: '✍️ 语法', icon: '✍️' },
    { key: 'listening', label: '🎧 听力', icon: '🎧' },
    { key: 'speaking', label: '🎙️ 口语', icon: '🎙️' },
  ];
  const PHASE_NAME = { vocab: '单词记忆', grammar: '语法练习', listening: '听力训练', speaking: '口语跟读' };

  const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* 相似度：归一化编辑距离 */
  function similarity(a, b) {
    const norm = s => String(s).toLowerCase().replace(/[.,!?;:'"（）()、。！？，～·「」…—-]/g, '').replace(/\s+/g, '');
    a = norm(a); b = norm(b);
    if (!a || !b) return 0;
    if (a === b) return 1;
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return 1 - dp[m][n] / Math.max(m, n);
  }

  let P = null; // 播放器状态

  on(/^\/lesson\/([\w-]+)$/, viewLesson);
  async function viewLesson(id) {
    if (!App.state.user) return location.hash = '#/login';
    $('#app').innerHTML = `<div id="nav-slot"></div><div class="page"><div class="boot-splash" style="min-height:50vh"><div class="spin"></div></div></div>`;
    App.renderNav();
    let data;
    try { data = await get('/api/lessons/' + id); } catch (e) { toast(e.message, 'error'); return location.hash = '#/courses'; }
    P = {
      lesson: data.lesson, langMeta: data.langMeta, prev: data.prev, next: data.next, best: data.best,
      phase: 'vocab', scores: { vocab: [], grammar: [], listening: [], speaking: [] },
      vocab: { step: 0, mode: 'cards', quiz: [], quizStep: 0, sel: null },
      grammar: { step: 0, sel: null, answered: false },
      listening: { step: 0, sel: null, revealed: false },
      speaking: { step: 0, heard: '', recognized: false },
    };
    renderShell();
  }

  function renderShell() {
    const L = P.lesson;
    const chips = PHASES.map((p, i) => {
      const order = ['vocab', 'grammar', 'listening', 'speaking'];
      const idx = order.indexOf(P.phase);
      return `<div class="phase-chip ${P.phase === p.key ? 'active' : idx > i ? 'done' : ''}">${p.label}</div>`;
    }).join('');
    $('#app').innerHTML = `
      <div id="nav-slot"></div>
      <div class="page player-wrap">
        <div class="player-top fade-in">
          <a class="back" href="#/courses" title="退出课时">←</a>
          <div class="player-title">
            <div class="pt1">${L.icon} ${esc(L.title)}</div>
            <div class="pt2">${P.langMeta.flag} ${esc(P.lesson.courseTitle)}${P.best ? ` · 上次成绩：${Object.values(P.best).reduce((a, b) => a + b, 0) / 4}分` : ''}</div>
          </div>
          <span class="nav-stat">${P.langMeta.flag} ${esc(P.langMeta.name)}</span>
        </div>
        <div class="phase-bar fade-in">${chips}</div>
        <div id="phase-mount"></div>
      </div>`;
    App.renderNav();
    if (P.phase !== 'done') {
      ({ vocab: renderVocab, grammar: renderGrammar, listening: renderListening, speaking: renderSpeaking }[P.phase])();
    }
  }

  const mount = html => { $('#phase-mount').innerHTML = `<div class="phase-card fade-in">${html}</div>`; };
  const foot = (progressPct, nextLabel, onNext, extraLeft = '') => `
    <div class="phase-foot">
      ${extraLeft}
      <div class="phase-progress"><div style="width:${progressPct}%"></div></div>
      <button class="btn-next" id="phase-next" ${onNext ? '' : 'disabled'}>${nextLabel}</button>
    </div>`;

  /* ================= 阶段一：单词记忆 ================= */
  function renderVocab() {
    const V = P.vocab, words = P.lesson.vocab;
    if (V.mode === 'cards') {
      const w = words[V.step];
      mount(`
        <div class="phase-head"><span class="phase-tag">🧠 单词记忆</span><span class="phase-count">${V.step + 1} / ${words.length}</span></div>
        <div class="phase-title">点击卡片翻面，先混个脸熟</div>
        <div class="phase-body">
          <div class="flashcard" id="fc">
            <div class="fc-inner">
              <div class="fc-face fc-front">
                <div class="term">${esc(w.t)}</div>
                ${w.r ? `<div class="reading">/${esc(w.r)}/</div>` : ''}
                <button class="speaker-btn" id="fc-speak" title="听发音">🔊</button>
              </div>
              <div class="fc-face fc-back">
                <div class="trans">${esc(w.z)}</div>
                <div class="example">${esc(w.ex)}<br/><span style="font-size:.85em;opacity:.75">${esc(w.ext)}</span></div>
              </div>
            </div>
          </div>
          <div class="fc-hint">👆 点击卡片查看释义与例句</div>
        </div>
        ${foot(((V.step + 1) / words.length * 100).toFixed(0), V.step === words.length - 1 ? '进入小测验 ✓' : '下一个 →', true)}
      `);
      const fc = $('#fc');
      fc.onclick = e => { if (e.target.id !== 'fc-speak') fc.classList.toggle('flipped'); };
      $('#fc-speak').onclick = () => speak(w.t, P.langMeta.speech);
      $('#phase-next').onclick = () => {
        if (V.step < words.length - 1) { V.step++; renderVocab(); }
        else {
          V.quiz = shuffle(words.map(w => ({ term: w.t, z: w.z, opts: shuffle([w.z, ...shuffle(words.filter(x => x.z !== w.z).map(x => x.z)).slice(0, 3)]) })));
          V.mode = 'quiz'; V.quizStep = 0; renderVocab();
        }
      };
    } else {
      // 单词小测验
      const q = V.quiz[V.quizStep];
      const opts = q.opts;
      mount(`
        <div class="phase-head"><span class="phase-tag">🧠 单词小测验</span><span class="phase-count">${V.quizStep + 1} / ${V.quiz.length}</span></div>
        <div class="phase-body">
          <div class="quiz-q">「<b style="font-size:1.3em">${esc(q.term)}</b>」的意思是？</div>
          <div class="quiz-opts">
            ${opts.map((o, i) => {
              let cls = '';
              if (V.sel !== null) {
                if (o === q.z) cls = 'right';
                else if (i === V.sel) cls = 'wrong';
              }
              return `<button class="quiz-opt ${cls}" data-i="${i}" ${V.sel !== null ? 'disabled' : ''}><span class="key">${'ABCD'[i]}</span>${esc(o)}</button>`;
            }).join('')}
          </div>
        </div>
        ${foot(((V.quizStep + (V.sel !== null ? 1 : 0)) / V.quiz.length * 100).toFixed(0), V.sel === null ? '' : (V.quizStep === V.quiz.length - 1 ? '下一环节 🎧' : '下一题 →'), V.sel !== null)}
      `);
      document.querySelectorAll('.quiz-opt').forEach(b => b.onclick = () => {
        if (V.sel !== null) return;
        V.sel = Number(b.dataset.i);
        P.scores.vocab.push(opts[V.sel] === q.z ? 100 : 0);
        document.querySelectorAll('.quiz-opt').forEach((x, i) => {
          if (opts[i] === q.z) x.classList.add('right');
          else if (i === V.sel) x.classList.add('wrong');
          x.disabled = true;
        });
        $('#phase-next').onclick = () => {
          if (V.quizStep < V.quiz.length - 1) { V.quizStep++; V.sel = null; renderVocab(); }
          else { P.phase = 'grammar'; renderShell(); }
        };
        // 更新进度条与按钮状态
        $('.phase-progress > div').style.width = ((V.quizStep + 1) / V.quiz.length * 100) + '%';
        const btn = $('#phase-next');
        btn.disabled = false;
        btn.textContent = V.quizStep === V.quiz.length - 1 ? '下一环节 🎧' : '下一题 →';
      });
    }
  }

  /* ================= 阶段二：语法练习 ================= */
  function renderGrammar() {
    const G = P.grammar, exs = P.lesson.grammar.exs;
    const q = exs[G.step];
    mount(`
      <div class="phase-head"><span class="phase-tag">✍️ 语法练习</span><span class="phase-count">${G.step + 1} / ${exs.length}</span></div>
      <div class="phase-title">📋 ${esc(P.lesson.grammar.t)}</div>
      <div class="phase-body">
        <div class="quiz-q">${esc(q.q)}</div>
        <div class="quiz-opts">
          ${q.o.map((o, i) => {
            let cls = '';
            if (G.answered) { if (i === q.a) cls = 'right'; else if (i === G.sel) cls = 'wrong'; }
            else if (i === G.sel) cls = 'sel';
            return `<button class="quiz-opt ${cls}" data-i="${i}"><span class="key">${'ABCD'[i]}</span>${esc(o)}</button>`;
          }).join('')}
        </div>
        <div id="grammar-tip"></div>
      </div>
      ${foot(((G.step + (G.answered ? 1 : 0)) / exs.length * 100).toFixed(0), G.answered ? (G.step === exs.length - 1 ? '下一环节 🎙️' : '下一题 →') : '', G.answered, `<a class="btn-ghost" id="btn-rule" style="padding:10px 16px;font-size:0.85rem">📖 语法讲解</a>`)}
    `);
    $('#btn-rule').onclick = () => {
      App.modal(`<h3>📖 ${esc(P.lesson.grammar.t)}</h3><div style="white-space:pre-wrap;line-height:2;color:#454A63;font-size:0.95rem">${esc(P.lesson.grammar.exp)}</div>`);
    };
    document.querySelectorAll('.quiz-opt').forEach(b => b.onclick = () => {
      if (G.answered) return;
      G.sel = Number(b.dataset.i); G.answered = true;
      P.scores.grammar.push(G.sel === q.a ? 100 : 0);
      document.querySelectorAll('.quiz-opt').forEach((x, i) => {
        if (i === q.a) x.classList.add('right');
        else if (i === G.sel) x.classList.add('wrong');
        x.disabled = true;
      });
      if (G.sel !== q.a) $('#grammar-tip').innerHTML = `<div class="quiz-tip">💡 ${esc(q.tip)}</div>`;
      else $('#grammar-tip').innerHTML = `<div class="quiz-tip" style="background:#F0FBF6;color:#187953">🎉 回答正确！${esc(q.tip)}</div>`;
      $('.phase-progress > div').style.width = ((G.step + 1) / exs.length * 100) + '%';
      const btn = $('#phase-next');
      btn.disabled = false;
      btn.textContent = G.step === exs.length - 1 ? '下一环节 🎙️' : '下一题 →';
    });
    $('#phase-next').onclick = () => {
      if (!G.answered) return;
      if (G.step < exs.length - 1) { G.step++; G.sel = null; G.answered = false; renderGrammar(); }
      else { P.phase = 'listening'; renderShell(); }
    };
  }

  /* ================= 阶段三：听力训练 ================= */
  function renderListening() {
    const LI = P.listening, items = P.lesson.listening;
    const item = items[LI.step];
    const isType = item.m === 'type';
    // 选择题选项：正确句 + 同课时其他句
    const opts = isType ? [] : shuffle([item.s, ...shuffle(items.filter(x => x.s !== item.s).map(x => x.s)).slice(0, 2)]);
    mount(`
      <div class="phase-head"><span class="phase-tag">🎧 听力训练</span><span class="phase-count">${LI.step + 1} / ${items.length}</span></div>
      <div class="phase-title">${isType ? '听到什么就写什么' : '选出你听到的句子'}</div>
      <div class="phase-body">
        <div class="listen-box">
          <button class="listen-sphere" id="btn-play">🔊</button>
          <div class="listen-hint">点击播放 · 可反复收听（${P.langMeta.nativeName}原声朗读）</div>
          ${isType ? `
            <input class="type-input" id="listen-input" placeholder="输入你听到的句子…" autocomplete="off" ${LI.revealed ? 'disabled' : ''} />
            <div class="self-rate">
              <button id="listen-check" ${LI.revealed ? 'disabled' : ''}>提交答案</button>
              <button id="listen-reveal" ${LI.revealed ? 'disabled' : ''}>看答案（此题 0 分）</button>
            </div>
          ` : `
            <div class="quiz-opts" style="width:100%">
              ${opts.map((o, i) => {
                let cls = '';
                if (LI.sel !== null) { if (o === item.s) cls = 'right'; else if (i === LI.sel) cls = 'wrong'; }
                return `<button class="quiz-opt ${cls}" data-i="${i}" ${LI.sel !== null ? 'disabled' : ''}><span class="key">${'ABC'[i]}</span>${esc(o)}</button>`;
              }).join('')}
            </div>
          `}
        </div>
        <div id="listen-result"></div>
      </div>
      ${foot(((LI.step + (LI.sel !== null || LI.revealed ? 1 : 0)) / items.length * 100).toFixed(0),
        LI.step === items.length - 1 ? '查看成绩 🎉' : '下一题 →', LI.sel !== null || LI.revealed)}
    `);
    const btnPlay = $('#btn-play');
    const play = () => { speak(item.s, P.langMeta.speech); btnPlay.classList.add('playing'); setTimeout(() => btnPlay.classList.remove('playing'), 1800); };
    btnPlay.onclick = play;
    setTimeout(play, 350);

    const advance = () => {
      if (LI.step < items.length - 1) { LI.step++; LI.sel = null; LI.revealed = false; renderListening(); }
      else { P.phase = 'speaking'; renderShell(); }
    };

    if (isType) {
      $('#listen-check').onclick = () => {
        const val = $('#listen-input').value.trim();
        if (!val) return toast('先听一听，再写下你听到的内容', 'error');
        const sim = similarity(val, item.s);
        P.scores.listening.push(sim >= 0.92 ? 100 : Math.round(sim * 100));
        LI.revealed = true;
        $('#listen-result').innerHTML = `
          <div class="reveal-sent">🗣️ ${esc(item.s)}</div>
          <div class="reveal-zh">${esc(item.z)} · 相似度 ${Math.round(sim * 100)}%</div>`;
        $('.phase-progress > div').style.width = ((LI.step + 1) / items.length * 100) + '%';
        $('#phase-next').disabled = false;
        $('#phase-next').textContent = LI.step === items.length - 1 ? '查看成绩 🎉' : '下一题 →';
      };
      $('#listen-reveal').onclick = () => {
        P.scores.listening.push(0);
        LI.revealed = true;
        $('#listen-result').innerHTML = `<div class="reveal-sent">🗣️ ${esc(item.s)}</div><div class="reveal-zh">${esc(item.z)}</div>`;
        $('.phase-progress > div').style.width = ((LI.step + 1) / items.length * 100) + '%';
        $('#phase-next').disabled = false;
        $('#phase-next').textContent = LI.step === items.length - 1 ? '查看成绩 🎉' : '下一题 →';
      };
      $('#listen-input').onkeydown = e => { if (e.key === 'Enter') $('#listen-check').click(); };
    } else {
      document.querySelectorAll('.quiz-opt').forEach(b => b.onclick = () => {
        if (LI.sel !== null) return;
        LI.sel = Number(b.dataset.i);
        const right = opts[LI.sel] === item.s;
        P.scores.listening.push(right ? 100 : 0);
        document.querySelectorAll('.quiz-opt').forEach((x, i) => {
          if (opts[i] === item.s) x.classList.add('right');
          else if (i === LI.sel) x.classList.add('wrong');
          x.disabled = true;
        });
        $('#listen-result').innerHTML = `<div class="reveal-zh" style="font-size:1rem;color:${right ? '#187953' : '#B2453F'};font-weight:700">${right ? '🎉 听对了！' : '再接再厉！'} ${esc(item.z)}</div>`;
        $('.phase-progress > div').style.width = ((LI.step + 1) / items.length * 100) + '%';
        $('#phase-next').disabled = false;
        $('#phase-next').textContent = LI.step === items.length - 1 ? '查看成绩 🎉' : '下一题 →';
      });
    }
    $('#phase-next').onclick = () => { if (LI.sel !== null || LI.revealed) advance(); };
  }

  /* ================= 阶段四：口语跟读 ================= */
  function renderSpeaking() {
    const SP = P.speaking, items = P.lesson.speaking;
    const item = items[SP.step];
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    mount(`
      <div class="phase-head"><span class="phase-tag">🎙️ 口语跟读</span><span class="phase-count">${SP.step + 1} / ${items.length}</span></div>
      <div class="phase-title">大声读出来，AI 帮你打分</div>
      <div class="phase-body">
        <div class="speak-target">
          <div class="st-main">🗣️ ${esc(item.s)}</div>
          <div class="st-zh">${esc(item.z)}</div>
          <div class="st-hint">💡 ${esc(item.h)}</div>
          <div style="margin-top:14px"><button class="speaker-btn dark" id="speak-demo" title="听标准发音">🔊</button></div>
        </div>
        <div class="speak-actions">
          ${SR ? `<button class="btn-mic" id="btn-mic">🎤 按住说话开始跟读</button>` : ''}
        </div>
        <div class="mic-status" id="mic-status">${SR ? '点击麦克风，朗读上方句子' : '当前浏览器不支持语音识别（建议 Chrome）'}</div>
        <div class="mic-heard" id="mic-heard"></div>
        <div class="self-rate">
          <span style="color:var(--muted);font-size:0.82rem;align-self:center">无法使用麦克风？自评：</span>
          <button data-s="95">😄 很流利（95）</button>
          <button data-s="80">🙂 有小错（80）</button>
          <button data-s="60">😅 有点难（60）</button>
        </div>
      </div>
      ${foot(((SP.step + (SP.recognized ? 1 : 0)) / items.length * 100).toFixed(0), SP.step === items.length - 1 ? '完成课时 🎉' : '下一句 →', SP.recognized)}
    `);
    $('#speak-demo').onclick = () => speak(item.s, P.langMeta.speech);
    setTimeout(() => speak(item.s, P.langMeta.speech), 400);

    const advance = () => {
      if (SP.step < items.length - 1) { SP.step++; SP.heard = ''; SP.recognized = false; renderSpeaking(); }
      else finishLesson();
    };

    document.querySelectorAll('.self-rate button[data-s]').forEach(b => b.onclick = () => {
      if (SP.recognized) return;
      P.scores.speaking.push(Number(b.dataset.s));
      SP.recognized = true;
      $('#mic-status').textContent = `自评 ${b.dataset.s} 分，练习重在坚持！`;
      $('#mic-heard').textContent = '';
      $('#phase-next').disabled = false;
      $('#phase-next').textContent = SP.step === items.length - 1 ? '完成课时 🎉' : '下一句 →';
      $('.phase-progress > div').style.width = ((SP.step + 1) / items.length * 100) + '%';
    });

    if (SR) {
      const btnMic = $('#btn-mic');
      let rec = null;
      btnMic.onclick = () => {
        if (SP.recognized) return;
        try { rec = new SR(); } catch (e) { return toast('语音识别初始化失败，请用自评', 'error'); }
        rec.lang = P.langMeta.speech;
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        $('#mic-status').textContent = '🎙️ 正在聆听，请朗读…';
        btnMic.classList.add('rec');
        let got = false;
        rec.onresult = e => {
          got = true;
          const said = e.results[0][0].transcript;
          SP.heard = said;
          const sim = similarity(said, item.s);
          const score = Math.round(sim * 100);
          P.scores.speaking.push(score);
          SP.recognized = true;
          $('#mic-heard').innerHTML = `🎧 我听到：${esc(said)}<br/><span style="color:${score >= 80 ? '#23B37D' : '#FF9F43'}">相似度 ${score}%</span>`;
          $('#mic-status').textContent = score >= 85 ? '发音很棒，几乎和原句一样！' : score >= 60 ? '不错的尝试！注意对比标准发音' : '再听一遍标准音，慢慢来';
          btnMic.classList.remove('rec');
          $('#phase-next').disabled = false;
          $('#phase-next').textContent = SP.step === items.length - 1 ? '完成课时 🎉' : '下一句 →';
          $('.phase-progress > div').style.width = ((SP.step + 1) / items.length * 100) + '%';
        };
        rec.onerror = e => {
          btnMic.classList.remove('rec');
          $('#mic-status').textContent = e.error === 'not-allowed'
            ? '麦克风权限被拒绝，可以在浏览器设置中开启，或使用下方自评'
            : '没有听清（' + e.error + '），再试一次或使用自评';
        };
        rec.onend = () => {
          btnMic.classList.remove('rec');
          if (!got && !SP.recognized) $('#mic-status').textContent = '未捕捉到语音，再试一次或使用自评';
        };
        rec.start();
      };
    }
    $('#phase-next').onclick = () => { if (SP.recognized) advance(); };
  }

  /* ================= 完成 ================= */
  async function finishLesson() {
    const avg = k => P.scores[k].length ? Math.round(P.scores[k].reduce((a, b) => a + b, 0) / P.scores[k].length) : 0;
    const scores = { vocab: avg('vocab'), grammar: avg('grammar'), listening: avg('listening'), speaking: avg('speaking') };
    P.phase = 'done';
    renderShell();
    const mountEl = $('#phase-mount');
    if (!mountEl) return;
    mountEl.innerHTML = `<div class="phase-card fade-in"><div class="boot-splash" style="min-height:200px"><div class="spin"></div></div></div>`;
    let result;
    try {
      result = await post(`/api/lessons/${P.lesson.id}/complete`, { scores });
      await App.loadMe();
    } catch (e) {
      return toast(e.message, 'error');
    }
    if (!document.body.contains($('#phase-mount'))) return; // 用户已离开页面
    App.renderNav();
    const avgScore = Math.round((scores.vocab + scores.grammar + scores.listening + scores.speaking) / 4);
    $('#phase-mount').innerHTML = `
      <div class="phase-card fade-in">
        <div class="done-hero">
          <div class="dh-ic">${avgScore >= 90 ? '🏆' : avgScore >= 70 ? '🎉' : '💪'}</div>
          <h2>${avgScore >= 90 ? '表现太出色了！' : avgScore >= 70 ? '课时完成，干得漂亮！' : '完成！多练一次会更棒'}</h2>
          <p>${esc(P.lesson.title)} · ${esc(P.langMeta.name)} · 综合得分 ${avgScore} 分</p>
        </div>
        <div class="score-rings">
          ${Charts.scoreRing(scores.vocab, '🧠', '单词')}
          ${Charts.scoreRing(scores.grammar, '✍️', '语法')}
          ${Charts.scoreRing(scores.listening, '🎧', '听力')}
          ${Charts.scoreRing(scores.speaking, '🎙️', '口语')}
        </div>
        <div class="xp-banner">⚡ 获得 ${result.xpGained} XP · 当前等级 Lv.${result.level}${result.firstTime ? ' · 新单词 +1 🧠' : ''}</div>
        ${result.newAchievements.map(a => `
          <div class="ach-pop"><div class="ap-ic">${a.icon}</div><div><div class="ap-t">解锁成就「${a.name}」</div><div class="ap-d">${esc(a.desc)}</div></div></div>`).join('')}
        <div style="display:flex;gap:12px;margin-top:22px">
          ${P.next ? `<button class="btn-primary" style="flex:1;padding:13px" id="done-next">继续下一课 →</button>` : ''}
          <button class="btn-ghost" style="flex:1" id="done-back">返回课程</button>
          <button class="btn-ghost" style="flex:1" id="done-again">再练一次</button>
        </div>
      </div>`;
    if (P.next) $('#done-next').onclick = () => viewLesson(P.next);
    $('#done-back').onclick = () => location.hash = '#/courses';
    $('#done-again').onclick = () => viewLesson(P.lesson.id);
    if (result.newAchievements.length) toast('🏆 解锁新成就：' + result.newAchievements.map(a => a.name).join('、'), 'success');
  }
})();
</script>
</body>
</html>
